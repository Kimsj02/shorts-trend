<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼츠 트렌드 - 오늘 뜨는 쇼츠</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#12161f; --border:#232a38;
    --text:#eef1f6; --muted:#8a93a6; --hot:#ff3860; --gold:#ffc94d; --line:#1c212c;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif;
    padding:28px 16px 60px;
  }
  .wrap{ max-width:820px; margin:0 auto; }
  .eyebrow{ font-size:12px; letter-spacing:.18em; color:var(--hot); font-weight:700; margin-bottom:10px; }
  h1{ font-size:30px; line-height:1.25; margin:0 0 8px; font-weight:800; letter-spacing:-.02em; }
  .sub{ color:var(--muted); font-size:14px; }
  header.hero{ padding:8px 4px 24px; border-bottom:1px solid var(--line); margin-bottom:20px; }

  .tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:16px; }
  .tab{
    flex:0 0 auto; padding:9px 15px; border-radius:999px; cursor:pointer;
    background:var(--panel); border:1px solid var(--border); color:var(--muted);
    font-size:13px; font-weight:600; white-space:nowrap;
  }
  .tab.on{ background:var(--hot); border-color:var(--hot); color:#fff; }

  .insight{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; margin-bottom:18px;
  }
  .insight h2{ font-size:13px; margin:0 0 12px; color:var(--gold); letter-spacing:.02em; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:14px; }
  .stat .k{ font-size:11px; color:var(--muted); margin-bottom:4px; }
  .stat .v{ font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; }

  .board{ display:flex; flex-direction:column; gap:10px; }
  .card{
    display:flex; gap:12px; background:var(--panel); border:1px solid var(--border);
    border-radius:12px; padding:10px; text-decoration:none; color:inherit; align-items:center;
  }
  .card:hover{ border-color:var(--hot); }
  .rank{ width:32px; flex:0 0 32px; text-align:center; font-weight:800; font-size:17px;
         font-variant-numeric:tabular-nums; color:var(--muted); }
  .rank.top1{ color:var(--gold); font-size:20px; }
  .rank.top2{ color:#d8dbe3; }
  .rank.top3{ color:#cd8a5c; }
  .thumb{ width:68px; height:68px; border-radius:9px; object-fit:cover; flex:0 0 68px; background:#1a1f29; }
  .meta{ min-width:0; flex:1; }
  .title{ font-size:13.5px; font-weight:600; line-height:1.4; margin-bottom:5px;
          display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .channel{ font-size:12px; color:var(--muted); margin-bottom:3px; }
  .views{ font-size:12.5px; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; }
  .dur{ color:var(--muted); font-weight:500; }
  .status{ text-align:center; color:var(--muted); font-size:13px; padding:40px 0; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">DAILY TREND</div>
    <h1>오늘 뜨는 쇼츠</h1>
    <div class="sub" id="asof">불러오는 중...</div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div id="insight"></div>
  <div id="board"></div>
</div>

<script>
let DATA = null;
let current = null;

function fmtViews(n){
  n = Number(n) || 0;
  if(n >= 100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'') + '억회';
  if(n >= 10000) return (n/10000).toFixed(1).replace(/\.0$/,'') + '만회';
  return n.toLocaleString('ko-KR') + '회';
}
function fmtDur(s){
  if(s < 60) return s + '초';
  const m = Math.floor(s/60), r = s % 60;
  return r === 0 ? m + '분' : m + '분 ' + r + '초';
}
function esc(s){ return String(s).replace(/</g,'&lt;'); }

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  Object.entries(DATA.categories).forEach(([id, c]) => {
    const b = document.createElement('div');
    b.className = 'tab' + (id === current ? ' on' : '');
    b.textContent = c.name;
    b.onclick = () => { current = id; render(); };
    el.appendChild(b);
  });
}

function render(){
  renderTabs();
  const c = DATA.categories[current];
  const ins = document.getElementById('insight');
  const board = document.getElementById('board');

  if(c.stats){
    ins.innerHTML = `
      <div class="insight">
        <h2>이 카테고리 상위 영상의 공통점</h2>
        <div class="grid">
          <div class="stat"><div class="k">평균 길이</div><div class="v">${fmtDur(c.stats.avgDurationSec)}</div></div>
          <div class="stat"><div class="k">주 업로드 시간</div><div class="v">${c.stats.peakUploadSlotKST || '-'}</div></div>
          <div class="stat"><div class="k">그 시간대 비중</div><div class="v">${c.stats.peakUploadShare ?? '-'}%</div></div>
          <div class="stat"><div class="k">평균 제목 길이</div><div class="v">${c.stats.avgTitleLength}자</div></div>
          <div class="stat"><div class="k">해시태그 사용</div><div class="v">${c.stats.hashtagShare}%</div></div>
          <div class="stat"><div class="k">중간 조회수</div><div class="v">${fmtViews(c.stats.medianViews)}</div></div>
        </div>
      </div>`;
  }else{
    ins.innerHTML = '';
  }

  if(!c.videos || c.videos.length === 0){
    board.innerHTML = '<div class="status">이 카테고리는 오늘 수집된 영상이 없어요.</div>';
    return;
  }

  board.innerHTML = '<div class="board">' + c.videos.map((v,i) => {
    const rank = i+1;
    const rc = rank===1?'top1':rank===2?'top2':rank===3?'top3':'';
    return `
      <a class="card" href="https://www.youtube.com/shorts/${v.id}" target="_blank" rel="noopener">
        <div class="rank ${rc}">${rank}</div>
        <img class="thumb" src="${v.thumb}" alt="" loading="lazy">
        <div class="meta">
          <div class="title">${esc(v.title)}</div>
          <div class="channel">${esc(v.channel)}</div>
          <div class="views">${fmtViews(v.views)} <span class="dur">· ${fmtDur(v.durationSec)}</span></div>
        </div>
      </a>`;
  }).join('') + '</div>';
}

fetch('data/latest.json?t=' + Date.now())
  .then(r => { if(!r.ok) throw new Error(); return r.json(); })
  .then(d => {
    DATA = d;
    current = Object.keys(d.categories)[0];
    document.getElementById('asof').textContent = d.date + ' 기준 · 매일 오전 9시 갱신';
    render();
  })
  .catch(() => {
    document.getElementById('asof').textContent = '';
    document.getElementById('board').innerHTML =
      '<div class="status">아직 수집된 데이터가 없어요.<br>Actions 탭에서 수집을 한 번 실행해주세요.</div>';
  });
</script>
</body>
</html>
